services:
  lgtm:
    build:
      context: .
      dockerfile: Dockerfile.lgtm
    image: kokochi-lab/otel-lgtm:0.37.0-ca-20261023
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3100:3100"
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:9090:9090"
    volumes:
      - lgtm-data:/data
      - ../grafana/provisioning/datasources/grafana-datasources.yaml:/otel-lgtm/grafana/conf/provisioning/datasources/grafana-datasources.yaml:ro
      - ../grafana/provisioning/dashboards/kokochi-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/kokochi-dashboards.yaml:ro
      - ../grafana/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards/kokochi:ro
    restart: unless-stopped
    stop_grace_period: 30s

  otel-collector:
    build:
      context: .
      dockerfile: Dockerfile
    image: kokochi-lab/otel-collector:0.163.2-healthcheck-v1
    command:
      - "--config=/etc/otelcol/config.yaml"
    volumes:
      - ./collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
    depends_on:
      lgtm:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /collector-healthcheck
        - http://127.0.0.1:13133/
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 5s
    mem_limit: 256m
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  lgtm-data:
