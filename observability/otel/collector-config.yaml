receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 64

  batch:
    timeout: 1s
    send_batch_size: 512

exporters:
  otlp_grpc/lgtm:
    endpoint: lgtm:4317
    tls:
      insecure: true
    timeout: 5s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 256
      sizer: requests
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 30s

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: /

service:
  extensions:
    - health_check

  pipelines:
    traces:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - batch
      exporters:
        - otlp_grpc/lgtm

    metrics:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - batch
      exporters:
        - otlp_grpc/lgtm

    logs:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - batch
      exporters:
        - otlp_grpc/lgtm
