[project]
name = "kokochi-ui-agent-readability-lab"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-semantic-conventions>=0.65b0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.2",
    "typer>=0.27.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-playwright>=0.8.0",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "external: tests that require explicit external network access",
]

[tool.uv]
constraint-dependencies = ["certifi>=2026.10.19", "urllib3>=2.8.0", "playwright>=1.64.0"]
required-version = ">=0.13.5,<0.14"
